   container_name: uoh_vite_docker_nico
   entrypoint: /bin/sh
   ports:
     - 8080:8080
   working_dir: /srv/app
   volumes:
     - type: bind
       source: ./
       target: /srv/app
   tty: true
   networks:
      - mynetwork
    
